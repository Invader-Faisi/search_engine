<!DOCTYPE html>
<html>
<head>
    <title>Login/Register - Search Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-10 col-lg-8 col-xl-6">

            <!-- Logo -->
            <div class="text-center mb-4">
                <h1 class="display-5 fw-bold text-primary">🔍 Keyword Based Search Engine</h1>
            </div>

            <!-- Card -->
            <div class="card shadow-lg border-0">
                <div class="card-header bg-white border-0 pt-4 pb-0">
                    <!-- Tabs -->
                    <ul class="nav nav-pills nav-fill mb-3" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-semibold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button" role="tab">
                                🔐 Login
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-semibold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register" type="button" role="tab">
                                📝 Register
                            </button>
                        </li>
                    </ul>
                </div>

                <div class="card-body p-4">
                    <div class="tab-content" id="authTabContent">

                        <!-- Login Form -->
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form method="POST" action="/login">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-secondary">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">👤</span>
                                        <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-secondary">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">🔒</span>
                                        <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required>
                                    </div>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg fw-bold">Sign In</button>
                                </div>
                                <div class="text-center mt-3">
                                    <a href="#" class="text-decoration-none text-primary">Forgot password?</a>
                                </div>
                            </form>
                        </div>

                        <!-- Register Form -->
                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form method="POST" action="/register">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-secondary">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">👤</span>
                                        <input type="text" name="username" class="form-control form-control-lg" placeholder="Choose username" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-secondary">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">📧</span>
                                        <input type="email" name="email" class="form-control form-control-lg" placeholder="Enter email" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-secondary">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">🔒</span>
                                        <input type="password" name="password" class="form-control form-control-lg" placeholder="Create password" required>
                                    </div>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-success btn-lg fw-bold">Create Account</button>
                                </div>
                                <div class="text-center mt-3">
                                    <small class="text-muted">By registering, you agree to our <a href="#" class="text-decoration-none">Terms</a> & <a href="#" class="text-decoration-none">Privacy</a></small>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-4">
                <a href="{{url_for('search.home')}}" class="text-decoration-none text-secondary">← Back to Search</a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

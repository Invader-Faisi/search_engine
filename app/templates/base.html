<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Keyword Search Engine{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand navbar-dark bg-primary bg-gradient px-4 shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{{ url_for('search.home') }}">🔍 Keyword Based Search Engine</a>

        <div class="ms-auto">
            {% if current_user.is_authenticated %}
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        👤 {{ current_user.username }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" href="{{ url_for('upload.upload') }}">📤 Upload Files</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="{{ url_for('auth.logout') }}">🚪 Logout</a></li>
                    </ul>
                </div>
            {% else %}
                <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('auth.login') }}">Login / Register</a>
            {% endif %}
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<!-- JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

<!-- Toastr Flash Messages -->
<script>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        $(document).ready(function() {
            {% for category, message in messages %}
                toastr.options = {
                    "closeButton": true,
                    "progressBar": true,
                    "positionClass": "toast-top-right",
                    "timeOut": "3000"
                };
                {% if category == 'success' %}
                    toastr.success("{{ message|escape}}");
                {% elif category == 'error' %}
                    toastr.error("{{ message|escape }}");
                {% elif category == 'info' %}
                    toastr.info("{{ message|escape }}");
                {% elif category == 'warning' %}
                    toastr.warning("{{ message|escape }}");
                {% endif %}
            {% endfor %}
        });
    {% endif %}
    {% endwith %}
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
